<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404: Page Not Found | Shahmeer Ali</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #090a0f;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: rgba(14, 16, 24, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 48px 32px;
        text-align: center;
        max-width: 480px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }
      h1 {
        font-size: 5rem;
        margin: 0 0 12px 0;
        color: #22d3ee;
      }
      p {
        color: #a1a1aa;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      a {
        display: inline-block;
        padding: 12px 24px;
        background: #22d3ee;
        color: #04121a;
        font-weight: 700;
        text-decoration: none;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>404</h1>
      <h2>ENDPOINT UNREACHABLE</h2>
      <p>The requested page or route does not exist.</p>
      <a href="/">Return to Base</a>
    </div>
  </body>
</html>
